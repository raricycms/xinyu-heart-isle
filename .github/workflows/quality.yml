name: quality

# 门禁的最终执行者。没有 CI 的时候，所有「会红」的保证都只靠自觉；
# 而这次审计恰好证明了「没人跑的门禁等于不存在」——
# perf.ts 的判失败线曾经松到 3 倍、smoke.ts 场景崩溃会假绿，
# 两处都活了很久，因为从来没人在一个干净环境里跑过它们。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # 项目在 Windows 上开发（沙盘笔刷、截图、端口清理都有平台差异），
    # 保持一致，避免「本地绿、CI 红」这种最消耗信任的失败模式。
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # ---- 类型 ----------------------------------------------------------
      # 不需要 `--force`：实测 `tsc -b --noEmit` 单独就足以捕获
      # TS6133（声明未使用）等错误，退出码 2。
      - name: 类型检查（应用）
        run: npx tsc -b --noEmit

      # scripts/ 不在 tsc -b 的引用图里，必须单独检查
      - name: 类型检查（脚本）
        run: npx tsc -p tsconfig.scripts.json --noEmit

      # ---- 幽灵字段 ------------------------------------------------------
      # 每个 Preferences 字段都必须既有读、又有写。
      # 这条检查值 5 个真实缺陷：soundEnabled / sandboxUiMode /
      # acknowledgedAge / acknowledgedDisclaimer 全都没实现，
      # nickname 则是「有读没写」（UI 分支永远为假）。
      - name: 幽灵字段（每个偏好字段都必须有读有写）
        run: npm run audit:ghost

      - name: 幽灵字段自检（注入幽灵必须被抓到）
        run: npm run audit:ghost:self-test

      # ---- i18n 死键 ------------------------------------------------------
      # 字典里每个键都必须有人 t() 引用。同一轮排查发现 42 个死键，
      # 其中 20+ 是「文案齐备但功能不存在」的证据 —— 和幽灵字段同源。
      - name: i18n 死键
        run: npm run audit:i18n

      - name: i18n 死键自检（动态前缀边界必须正确）
        run: npm run audit:i18n:self-test

      # ---- CSS 自定义属性 ---------------------------------------------------
      # 浏览器对「var() 指向未定义变量」的处理是**静默丢弃整条声明**，
      # 不报错、不进控制台。项目里真实发生过 81 处这类引用（整套
      # --fs-* 字号、--shadow-1..3、--r-pill、--dur-fast 从未定义），
      # 导致沙盘工作台的圆角与阴影上线起就没生效过，而 tsc/单测/E2E
      # 全绿。只能静态对账：把每个 var() 和定义表求差。
      - name: CSS 未定义变量
        run: npm run audit:css

      - name: CSS 未定义变量自检（有 fallback 的必须放行）
        run: npm run audit:css:self-test

      # ---- 构建 ----------------------------------------------------------
      # 必须先于 vitest / E2E / a11y / perf：
      # 体积预算和三个审计脚本都读 dist/。
      # 顺序反了的话，perf.test.ts 的体积断言会被静默跳过（历史缺陷）。
      - name: 构建
        run: npx vite build

      # ---- 测试 ----------------------------------------------------------
      - name: 单元与性能
        run: npx vitest run

      - name: 格式校验器（样例）
        run: node --experimental-strip-types --no-warnings scripts/validate-session.ts samples/example.sandplay.json

      # 校验器必须能拒绝坏样例——只测「接受」不测「拒绝」等于只测了一半
      - name: 格式校验器（拒绝坏样例）
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --no-warnings scripts/validate-session.ts samples/broken.sandplay.json
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "✓ 正确拒绝了坏样例（退出码 1）"
          else
            echo "✗ 坏样例的退出码是 $code，期望 1"
            exit 1
          fi

      # ---- 真浏览器门禁 --------------------------------------------------
      - name: E2E 冒烟
        run: node --experimental-strip-types --no-warnings scripts/e2e/smoke.ts

      # 移动端 390px 场景的断言也要被验证：注入「500px 宽元素」和
      # 「8×8px 按钮」，要求分别被抓到。第一版断言用 innerWidth 做基准，
      # 而它会跟着溢出内容一起变大（390→501），断言恒真 —— 正是这一步发现的。
      - name: E2E 移动端规则自检（注入缺陷必须被抓到）
        run: node scripts/audit/e2e-self-test.mjs

      # 键盘全流程场景抓到过一个真 bug：SandboxPage 的 onItemCommit 只用 id，
      # from/to 都取当前坐标 → 方向键微调被提交成原地不动。
      # tsc 放行（少写参数合法）、547 条单测放行，只有这条 E2E 会红。
      - name: 键盘流程自检（注入缺陷必须被抓到）
        run: node scripts/audit/keyboard-self-test.mjs

      # 视觉回归（3 场景 × 2 次渲染逐像素比对，见 docs/TESTING.md §4.8）
      - name: 视觉回归
        run: node scripts/visual-regression.mjs

      # 视觉回归的「逐像素一致」断言天然容易写成恒真，
      # 所以注入随机噪点 / 擦掉画面，确认它真的会红。
      - name: 视觉回归自检（注入缺陷必须被抓到）
        run: node scripts/audit/visual-self-test.mjs

      # VISION §7.4 性能一行要求「100 个摆件 / 帧率」，此前从未断言。
      # 这里量 100 / 400 摆件的单帧绘制开销（不量 rAF 帧间隔 ——
      # 按需重绘的页面上那是 Chrome 合成器的空转节奏，恒真）。
      - name: 渲染性能（100 / 400 摆件）
        run: node scripts/render-perf.mjs

      - name: 渲染性能自检（注入缺陷必须被抓到）
        run: node scripts/audit/render-perf-self-test.mjs

      - name: 无障碍审计
        run: node --experimental-strip-types --no-warnings scripts/audit/a11y.ts

      # a11y 规则本身也要被验证。三条判据（keyboard-unreachable /
      # reduced-motion / 路由覆盖）都曾**恒真**——从没红过的规则
      # 等于没有规则。这一步注入 6 种缺陷，要求每条都被捕获，
      # 其中一条是反向验证（合法 roving tabindex 组不得误报）。
      # 它把 dist 复制到 tmp/mut-dist/ 再注入，全程不碰 dist/。
      - name: 无障碍规则自检（注入缺陷必须被抓到）
        run: node scripts/audit/meta-self-test.mjs

      - name: 性能预算
        run: node --experimental-strip-types --no-warnings scripts/audit/perf.ts

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: scripts/e2e/screenshots/
          if-no-files-found: ignore
